# Tâches planifiées de JazzImmo.
#
# Chaque job appelle une route /api/cron/* du site déployé, authentifiée par CRON_SECRET
# (en-tête x-cron-secret, voir src/lib/cronAuth.ts).
#
# À configurer dans GitHub > Settings > Secrets and variables > Actions :
#   - secret   CRON_SECRET : la même valeur que la variable CRON_SECRET sur Vercel
#   - variable SITE_URL    : URL publique du site, sans slash final (ex. https://JazzImmo.fr)
#
# GitHub ne lance les workflows planifiés que depuis la branche par défaut (main),
# avec parfois quelques minutes de retard : les routes sont conçues pour le tolérer.

name: Crons

on:
  schedule:
    - cron: '7 * * * *'      # toutes les heures, à h+7 (évite le pic de h+0 chez GitHub)
  workflow_dispatch:          # lancement manuel depuis l'onglet Actions

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false        # un cron en échec n'empêche pas les autres
      matrix:
        route: [new-biens, price-alerts, pois, plans-expires]
    steps:
      - name: Appel /api/cron/${{ matrix.route }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "::error::CRON_SECRET (secret) ou SITE_URL (variable) non configuré"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST -H "x-cron-secret: $CRON_SECRET" \
            "$SITE_URL/api/cron/${{ matrix.route }}"
