# Vérifications automatiques à chaque pull request et à chaque push sur main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Types
        run: npx tsc --noEmit
      # ~230 erreurs ESLint historiques : informatif tant qu'elles ne sont pas résorbées
      - name: Lint (informatif)
        run: npx eslint --quiet src
        continue-on-error: true
